  <style>
    body { overflow-x: hidden; }
    .skip-link { position: absolute; top: -100px; left: 16px; background: var(--md-sys-color-primary); color: var(--md-sys-color-on-primary); padding: 8px 16px; border-radius: var(--md-shape-corner-small); font-family: var(--font-sans); font-size: 13px; z-index: 200; text-decoration: none; transition: top 0.2s; }
    .skip-link:focus { top: 12px; }
    :focus-visible { outline: 2px solid var(--md-sys-color-primary); outline-offset: 3px; border-radius: var(--md-shape-corner-extra-small); }
    @keyframes splashPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

    /* Top bar links */
    .top-bar-link { font-family: var(--font-sans); font-size: 13px; color: var(--md-sys-color-on-surface-variant); text-decoration: none; padding: 8px 12px; border-radius: var(--md-shape-corner-small); transition: color 0.2s, background-color 0.2s; }
    .top-bar-link:hover { color: var(--md-sys-color-on-surface); background: color-mix(in oklab, var(--md-sys-color-on-surface) 6%, transparent); }
    .wordmark { font-family: var(--font-serif); font-style: italic; font-weight: 700; font-size: 18px; color: var(--md-sys-color-primary); text-decoration: none; }

    /* Phone top bar: wrap and centre like the city pages instead of overflowing a fixed-height row. */
    @media (max-width: 700px) {
      .m3-top-app-bar { height: auto; flex-wrap: wrap; justify-content: center; gap: 2px 6px; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); }
      .m3-top-app-bar nav { flex-wrap: wrap; justify-content: center; gap: 2px; }
      .top-bar-link { padding: 6px 9px; font-size: 12px; }
      .wordmark { font-size: 16px; }
    }

    /* City card visual */
    .city-tile { display: flex; flex-direction: column; gap: 14px; text-decoration: none; color: inherit; min-height: 220px; }
    .city-tile.featured { min-height: 460px; }
    .city-tile .swatch-stripe { height: 6px; border-radius: var(--md-shape-corner-extra-small); }
    .city-tile .name-native { font-family: var(--font-serif); font-style: italic; font-weight: 700; }
    .city-tile.featured .name-native { font-size: 36px; line-height: 1.05; }
    .city-tile:not(.featured) .name-native { font-size: 22px; line-height: 1.1; }
    .city-tile .name-en { font-family: var(--font-sans); font-weight: 600; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--md-sys-color-on-surface-variant); }
    .city-tile .tagline { font-family: var(--font-sans); font-size: 14px; line-height: 1.55; color: var(--md-sys-color-on-surface-variant); }
    .city-tile.featured .tagline { font-size: 16px; line-height: 1.6; }
    .city-tile .row { display: flex; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 8px; }
    .city-tile .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .city-tile .status-dot.live { background: var(--md-sys-color-primary); box-shadow: 0 0 12px var(--md-sys-color-primary); }
    .city-tile .status-dot.coming { background: var(--md-sys-color-outline); }

    /* Phase pills */
    .phase-card { min-width: 280px; max-width: 340px; padding: 28px; border-radius: var(--md-shape-corner-large); }

    /* Mechanic card */
    .mechanic-icon { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: var(--md-shape-corner-large); background: var(--md-sys-color-secondary-container); color: var(--md-sys-color-on-secondary-container); margin-bottom: 16px; }

    /* Hero */
    .hero-tagline-1 { display: block; }
    .hero-tagline-2 { display: block; font-style: italic; color: var(--md-sys-color-primary); }
    .hero-meta { font-family: var(--font-sans); font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--md-sys-color-on-surface-variant); }
    .scroll-cue { position: absolute; bottom: 32px; left: 50%; transform: translateX(-50%); font-family: var(--font-sans); font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--md-sys-color-on-surface-variant); opacity: 0.6; animation: scrollCue 2.4s ease-in-out infinite; }
    @keyframes scrollCue {
      0%, 100% { transform: translate(-50%, 0); opacity: 0.4; }
      50% { transform: translate(-50%, 6px); opacity: 0.85; }
    }

    /* World map */
    .world-map svg { width: 100%; max-width: 880px; height: auto; }
    .world-map .heart-mark { transform-origin: center; transform-box: fill-box; }

    /* Heartbeat showcase */
    .big-heartbeat { display: flex; flex-direction: column; align-items: center; gap: 28px; }
    .big-heartbeat .pulse { font-size: clamp(120px, 22vw, 220px); line-height: 1; color: var(--md-sys-color-primary); }
  </style>

<body>
  <a class="skip-link" href="#hero">Skip to content</a>

  <div class="grain" aria-hidden="true"></div>

  <div id="splash" style="position:fixed;inset:0;background:#0b0614;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s ease-out">
    <svg width="80" height="74" viewBox="-15 -10 230 200" style="animation:splashPulse 1.5s ease-in-out infinite" aria-hidden="true">
      <defs><linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#e11d48"/><stop offset="100%" stop-color="#fb7185"/></linearGradient></defs>
      <path d="M100 170 C50 130 5 100 5 60 C5 28 30 8 58 8 C76 8 92 20 100 38 C108 20 124 8 142 8 C170 8 195 28 195 60 C195 100 150 130 100 170Z" fill="url(#sg)"/>
    </svg>
    <p style="font-family:sans-serif;font-size:11px;letter-spacing:4px;color:#c2185b;margin-top:20px;text-transform:uppercase">Loading</p>
  </div>

  <div id="root" role="main"></div>

  <script type="text/babel" data-presets="react">
    function waitForReady(cb) {
      if (window.CorShared && window.CorShared.ready) {
        window.CorShared.ready.then(cb);
      } else {
        setTimeout(() => waitForReady(cb), 30);
      }
    }

    waitForReady((data) => {
      const C = window.CorShared;
      const { Heart, BigHeart, Viral, Stat, Card, Tag, Icon, Heartbeat, CeremonyTile, MilestoneMatrix } = C;
      const { useState, useEffect } = React;

      const cities = data.CITIES.cities;
      const constitution = data.CONSTITUTION;
      const wave = constitution.rollingWave || {};
      const stages = wave.stages || [];
      const phases = wave.phases || [];
      const cityOperational = wave.cityOperational || {};
      const upcomingBiennale = data.CITIES.biennaleHosts.find(b => b.year >= 2027) || data.CITIES.biennaleHosts[0];
      const upcomingHostCity = cities.find(c => c.slug === upcomingBiennale.city);

      // Andorra is the featured tile in the bento grid; everyone else tiles around.
      const featured = cities.find(c => c.slug === "andorra");
      const others = cities.filter(c => c.slug !== featured.slug);

      // Stage milestones derived from the constitution's cityOperational map. For cities not
      // yet built, we synthesise the four stages around their target operational year. Once a
      // city's vocab.js is published, its real milestones (with full narratives) override.
      const stageMilestones = (city) => {
        const op = cityOperational[city.slug] || 2040;
        return [
          { year: op - 5, stage: "Charter",      commitment: "Cor Charter signed. " + city.monumentName + " site secured. International architecture competition awarded." },
          { year: op - 3, stage: "Break Ground", commitment: "Construction begins on " + city.monumentName + " and the first Hearths-of-the-Heart housing block." },
          { year: op,     stage: "Operational",  commitment: city.monumentName + " opens at " + city.monumentHeightM + " metres. Daily Ceremony begins broadcasting at the city's declared Cor hour. First 1,000 homes delivered." },
          { year: op + 25,stage: "Generation",   commitment: city.monumentName + " reaches its quarter-century. First Cor Generation children raised in the network reach adulthood. Second-wave expansion added." }
        ];
      };

      function TopBar() {
        return (
          <header className="m3-top-app-bar">
            <a className="wordmark" href="#hero">Cor del Món</a>
            <nav style={{ display: "flex", alignItems: "center", gap: 4 }} aria-label="Sections">
              <a className="top-bar-link" href="#hearts">Cities</a>
              <a className="top-bar-link" href="#heartbeat">Heartbeat</a>
              <a className="top-bar-link" href="#arc">Arc</a>
              <a className="top-bar-link" href="#mechanics">Mechanics</a>
              <a className="top-bar-link" href="#coryear">Year</a>
              <a className="top-bar-link" href="#join">Join</a>
              <span style={{ marginLeft: 12, color: "var(--md-sys-color-primary)" }}><Heartbeat size={20} /></span>
            </nav>
          </header>
        );
      }

      function Hero() {
        return (
          <section id="hero" className="m3-hero">
            <p className="hero-meta" style={{ marginBottom: 28 }}>Cor del Món · Q3 2026</p>
            <h1 className="m3-display-large" style={{ maxWidth: 980 }}>
              <span className="hero-tagline-1">Six cities</span>
              <span className="hero-tagline-2">beat as one.</span>
            </h1>
            <p className="m3-body-large" style={{ maxWidth: 580, marginTop: 28 }}>
              Six cities of culture and exchange, each shaped by its own spirit, all sharing one synchronized heartbeat.
            </p>
            <div style={{ marginTop: 44, color: "var(--md-sys-color-primary)" }}>
              <Heartbeat size={56} />
            </div>
            <div className="scroll-cue">Scroll</div>
          </section>
        );
      }

      const STAGE_LABEL = { concept: "Concept ready", proposal: "Proposal", planned: "Planned" };

      function CityTile({ city, featured }) {
        const published = city.status === "live";
        const stage = STAGE_LABEL[city.lifecycle] || "Concept ready";
        const cardClass = featured ? "m3-card-featured city-tile featured" : "m3-card-filled city-tile";
        const featuredAttr = featured ? "featured-2x2" : "";
        return (
          <a className={`${cardClass} ${featuredAttr}`.trim()} href={city.url} aria-label={`${city.name.english} city page`}>
            <div className="swatch-stripe" style={{ background: city.rose }} />
            <div className="name-en">{city.country.name}</div>
            <div className="name-native">{city.name.native}</div>
            {city.name.native !== city.name.english ? (
              <div className="m3-body-small" style={{ marginTop: -8, fontStyle: "italic" }}>{city.name.english}</div>
            ) : null}
            <p className="tagline">{city.tagline.english}</p>
            <div className="row">
              <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span className={`status-dot ${published ? 'live' : 'coming'}`} />
                <span className="m3-label-medium" style={{ color: published ? "var(--md-sys-color-primary)" : "var(--md-sys-color-on-surface-variant)" }}>{stage}</span>
              </span>
              <Icon name="residency" size={18} color="var(--md-sys-color-on-surface-variant)" />
            </div>
          </a>
        );
      }

      function HeartsBento() {
        return (
          <section id="hearts" className="m3-section">
            <p className="m3-label-small">The Six Hearts</p>
            <h2 className="m3-headline-large" style={{ marginTop: 8, marginBottom: 18 }}>The Wave-1 cities</h2>
            <p className="m3-body-large" style={{ maxWidth: 720, marginBottom: 32 }}>Each city honours the same nine-section structure, each one shaped by its own materials, motifs, and seismic reality. Andorra is live. The other five arrive over the second half of 2026.</p>
            <div className="bento">
              <CityTile city={featured} featured />
              {others.map(c => <CityTile key={c.slug} city={c} />)}
            </div>
          </section>
        );
      }

      function HeartbeatShowcase() {
        return (
          <section id="heartbeat" className="m3-cinematic">
            <p className="m3-label-small" style={{ marginBottom: 24 }}>Synchronized Heartbeat</p>
            <h2 className="m3-display-medium" style={{ maxWidth: 800, marginBottom: 32 }}>
              Six cities,<br/><span style={{ fontStyle: "italic", color: "var(--md-sys-color-primary)" }}>one heartbeat</span>, every UTC tick.
            </h2>
            <div className="big-heartbeat scroll-heart">
              <span className="pulse"><Heartbeat size={180} /></span>
            </div>
            <p className="m3-body-medium" style={{ maxWidth: 580, marginTop: 32 }}>
              Every monument's heart pulses on the same UTC tick at 60 BPM. Open two cities in two browser tabs and watch the hearts move together. No server, no broadcast, no telemetry. The clock that holds the network is in every page itself.
            </p>
            <div style={{ marginTop: 36 }}>
              <CeremonyTile />
            </div>
          </section>
        );
      }

      function HeroMap() {
        const project = (lon, lat) => ({ x: (lon + 180) * (800 / 360), y: (90 - lat) * (400 / 180) });
        const [phase, setPhase] = useState(0);
        useEffect(() => {
          let raf;
          const loop = () => { setPhase(Date.now() % 1000); raf = requestAnimationFrame(loop); };
          raf = requestAnimationFrame(loop);
          return () => cancelAnimationFrame(raf);
        }, []);
        const t = phase / 1000;
        const beat = 1 + 0.18 * Math.exp(-Math.pow((t - 0.05) * 8, 2));
        return (
          <section id="map" className="m3-section world-map" style={{ paddingTop: 32, paddingBottom: 64 }}>
            <p className="m3-label-small" style={{ textAlign: "center" }}>The geographic shape</p>
            <h2 className="m3-headline-medium" style={{ textAlign: "center", marginTop: 8, marginBottom: 32 }}>From Andorra outward, in six directions.</h2>
            <div style={{ display: "flex", justifyContent: "center" }}>
              <svg viewBox="0 0 800 400" aria-label="World map of Cor del Món network cities">
                <rect width="800" height="400" fill="color-mix(in oklab, var(--md-sys-color-primary) 2%, transparent)" />
                {cities.map((a, i) => cities.slice(i + 1).map((b, j) => {
                  const pa = project(a.coords.lon, a.coords.lat);
                  const pb = project(b.coords.lon, b.coords.lat);
                  return (
                    <line key={`${i}-${j}`} x1={pa.x} y1={pa.y} x2={pb.x} y2={pb.y}
                      stroke="var(--md-sys-color-primary)" strokeOpacity="0.10" strokeWidth="0.6" />
                  );
                }))}
                {cities.map(city => {
                  const p = project(city.coords.lon, city.coords.lat);
                  return (
                    <g key={city.slug} transform={`translate(${p.x - 14} ${p.y - 14})`}>
                      <g className="heart-mark" style={{ transform: `scale(${beat.toFixed(3)})` }}>
                        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
                              fill={city.rose} transform="translate(2 2) scale(0.8)" />
                      </g>
                      <text x="14" y="38" textAnchor="middle" fontSize="9" fill="var(--md-sys-color-on-surface-variant)" fontFamily="var(--font-sans)">{city.name.english}</text>
                    </g>
                  );
                })}
              </svg>
            </div>
          </section>
        );
      }

      function NetworkArc() {
        const matrixCities = cities.map(c => ({ slug: c.slug, name: c.name, milestones: stageMilestones(c) }));
        const stageColours = Object.fromEntries(stages.map(s => [s.name, s.color]));
        return (
          <section id="arc" className="m3-section">
            <p className="m3-label-small">The Rolling Wave</p>
            <h2 className="m3-headline-large" style={{ marginTop: 8, marginBottom: 18 }}>2027 to 2042, five phases</h2>
            <p className="m3-body-large" style={{ maxWidth: 760, marginBottom: 28 }}>Cor del Món is a rolling wave, not a synchronized handover. Every city builds the same 12 metre heart, the shared heart-core made the whole monument, in its own materials and culture, crowned at night by a heart of light that beats in sync with all six. Each takes four to seven years to build. Andorra leads in 2032; Adelaide and Yokohama join in 2035-2036; Valparaíso, Cape Town, and Jaipur reach operational by 2038-2040. Each city has its own four stages (Charter, Break Ground, Operational, Generation) at city-specific years.</p>
            <div className="scroll-rail" role="list" style={{ marginInline: -24 }}>
              {phases.map(p => (
                <div key={p.name} role="listitem" className="phase-card m3-card-elevated"
                     style={{ borderTop: "4px solid var(--md-sys-color-primary)" }}>
                  <div className="m3-display-small" style={{ color: "var(--md-sys-color-primary)" }}>{p.years}</div>
                  <div className="m3-label-small" style={{ marginTop: 8, color: "var(--md-sys-color-primary)" }}>{p.name}</div>
                  <p className="m3-body-medium" style={{ marginTop: 14 }}>{p.description}</p>
                </div>
              ))}
            </div>
            <div className="m3-card-outlined" style={{ marginTop: 32, padding: 16 }}>
              <MilestoneMatrix cities={matrixCities} stageColours={stageColours} />
            </div>
            <p className="m3-body-small" style={{ marginTop: 18, fontStyle: "italic" }}>
              Andorra's full milestone narrative lives at <a href="andorra/#roadmap" style={{ color: "var(--md-sys-color-primary)" }}>/andorra/</a>. Yokohama at <a href="yokohama/#roadmap" style={{ color: "var(--md-sys-color-primary)" }}>/yokohama/</a>. The other four city pages and their full roadmaps arrive over Q3 to Q4 2026.
            </p>
          </section>
        );
      }

      function Mechanics() {
        const mechs = [
          { icon: "heart",     title: "Synchronized Heartbeat", body: "Every monument pulses on the same UTC tick at 60 BPM. No server, no broadcast." },
          { icon: "sun",       title: "Daily Ceremony",         body: "Sixty seconds at each operational city's chosen Cor hour (typically aligned with local sunset, set by each city when it goes Operational). The rotation activates city by city. Andorra alone broadcasts from 2032; full six-city rotation by 2042." },
          { icon: "residency", title: "Cor Residency",          body: "Each operational city hosts ten incoming and ten outgoing per year. The network ramps with the rolling wave: 10/year from 2032, 30/year from 2035, 60/year from 2038." },
          { icon: "flame",     title: "Annual Cor Biennale",    body: `Rotating two-month festival of love urbanism. Next host: ${upcomingHostCity?.name.english} ${upcomingBiennale.year}.` },
          { icon: "book",      title: "Cor Pattern Library",    body: "Open-source repository of love-urbanism patterns. Every city contributes at least three per year. CC BY-NC 4.0." },
          { icon: "key",       title: "Wave-2 Admission",       body: "From 2035, candidate cities apply via four signatures. Target: thirty-plus by 2050." }
        ];
        return (
          <section id="mechanics" className="m3-section">
            <div style={{ display: "grid", gridTemplateColumns: "1fr", gap: 32 }}>
              <div>
                <p className="m3-label-small">Mechanics + Constitution</p>
                <h2 className="m3-headline-large" style={{ marginTop: 8, marginBottom: 18 }}>How a network stays in sync</h2>
                <p className="m3-body-large" style={{ maxWidth: 720, marginBottom: 8 }}>Six mechanics keep Cor del Món coherent across timezones. The first two are mechanical. The other four are human. The full charter lives at <a href="network-constitution.md" style={{ color: "var(--md-sys-color-primary)" }}>network-constitution.md</a>.</p>
              </div>
              <div className="bento">
                {mechs.map((m, i) => (
                  <div key={i} className={"m3-card-filled " + (i < 2 ? "featured-2x1" : "")}>
                    <div className="mechanic-icon"><Icon name={m.icon} size={24} color="currentColor" /></div>
                    <h3 className="m3-title-large" style={{ marginBottom: 10 }}>{m.title}</h3>
                    <p className="m3-body-medium">{m.body}</p>
                  </div>
                ))}
              </div>
            </div>
          </section>
        );
      }

      function Join() {
        const sigs = [
          { tag: "1. Hologram-only expression (the default)", desc: "The recommended path. The city installs a projection, hologram, and augmented-reality version of its Cor del Món expression inside an existing public building. No new construction, no land take, no seismic or heritage risk, no permits beyond standard public-event approvals. Roughly one to three percent of any built-version cost. Six to eighteen months to opening. Fully reversible at any time." },
          { tag: "2. Print, broadcast, and online expression", desc: "A book, exhibition catalogue, documentary, open-access website, or network of public talks honouring the design idea, with no physical installation. The lightest commitment of all." },
          { tag: "3. Built version (only if a city chooses it)", desc: "A built monument is described in each city's page only as a design-research scenario. It is not the recommended path and would only ever proceed under the city's own statutory review, on the city's own timeline, with licensed local professionals, with the city as the commissioning authority. The proposal does not commission, fund, or coordinate any built version." },
          { tag: "4. Hosting (any of the above)", desc: "If a city chooses to honour the idea, it sets its own Cor hour and its own civic-calendar fit. The proposal exists only to make the design idea more legible and shareable." }
        ];
        return (
          <section id="join" className="m3-section" style={{ paddingBottom: 80, textAlign: "center" }}>
            <p className="m3-label-small">Join</p>
            <h2 className="m3-display-small" style={{ maxWidth: 720, margin: "12px auto 18px" }}>Honour the idea, in whichever weight fits</h2>
            <p className="m3-body-large" style={{ maxWidth: 720, margin: "0 auto 36px" }}>Cor del Món is offered as a creative-research design idea, freely available to any city that wishes to honour it. There is no application form, no fee, no consultancy contract, no commercial offer. The lightest expression below is the recommended default for any city.</p>
            <div className="bento" style={{ maxWidth: 880, margin: "0 auto 36px", textAlign: "left" }}>
              {sigs.map((s, i) => (
                <div key={i} className="m3-card-outlined">
                  <div className="m3-label-medium" style={{ color: "var(--md-sys-color-primary)" }}>{s.tag}</div>
                  <p className="m3-body-medium" style={{ marginTop: 10 }}>{s.desc}</p>
                </div>
              ))}
            </div>
            <div style={{ display: "flex", gap: 12, justifyContent: "center", flexWrap: "wrap" }}>
              <a className="m3-button m3-button-filled" href="https://github.com/sara-star-quant/cor-del-mon/issues/new?template=contact.yml" target="_blank" rel="noopener">Open a contact thread</a>
              <a className="m3-button m3-button-outlined" href="DISCLAIMER.md">Read the full disclaimer</a>
            </div>
            <p className="m3-body-small" style={{ marginTop: 18, opacity: 0.7, maxWidth: 720, marginLeft: "auto", marginRight: "auto" }}>The contact thread is a structured form on GitHub Issues (correction, native-speaker review, community review, local-administrative review, removal request). Public by default. No commercial inquiries, no investment inquiries, no consultancy inquiries. No funds have been raised, applied for, awarded, committed, or accepted for this proposal.</p>
          </section>
        );
      }

      function Footer() {
        return (
          <footer style={{ textAlign: "center", padding: "60px 24px 40px", borderTop: "1px solid var(--md-sys-color-outline-variant)", position: "relative", zIndex: 1 }}>
            <div style={{ color: "var(--md-sys-color-primary)" }}><Heartbeat size={28} /></div>
            <p className="m3-label-small" style={{ marginTop: 14 }}>Cor del Món · v1.0 · Q3 2026</p>
            <p style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: 22, color: "var(--md-sys-color-primary)", marginTop: 18 }}>Six cities beat as one.</p>
            <p className="m3-body-small" style={{ marginTop: 18 }}>© 2026 sara-star-quant. Code under PolyForm Noncommercial 1.0.0, content under CC BY-NC 4.0.</p>
            <p className="m3-body-small" style={{ marginTop: 14, maxWidth: 760, marginLeft: "auto", marginRight: "auto", lineHeight: 1.65, opacity: 0.85 }}>
              <strong>Disclaimer.</strong> Cor del Món is a conceptual design proposal and creative-research project to make a love-themed civic and architectural idea more popular and more legible worldwide. Nothing on this site is professional advice of any kind (legal, financial, architectural, urban-planning, immigration, heritage, medical, or otherwise). All numbers, costs, heights, housing counts, and milestones are illustrative only and will differ materially upon any formal review. Named authorities, ministries, places, architects, and individuals are referenced descriptively for context only; no partnership, endorsement, affiliation, contract, or relationship is claimed or implied. <strong>No funds have been raised, applied for, awarded, committed, or accepted for this proposal. No investment is solicited. No commercial consultancy is offered. No fee is charged for any city to honour the idea.</strong> The recommended way for any city to participate is the hologram-only expression (projection, hologram, and augmented-reality installation inside an existing public building, fully reversible, no new construction); the built monuments described in each city page are design-research scenarios only. Where the proposal touches Indigenous, heritage, or community matters, it defers entirely to whichever statutory authorities and community organisations are recognised under local law and custom at the time of any real engagement; no specific organisation is named as a partner. Where the proposal conflicts with existing law, regulation, or community will, the existing law, regulation, or community will prevails. <a href="DISCLAIMER.md" style={{ color: "var(--md-sys-color-primary)" }}>Read the full disclaimer at /DISCLAIMER.md</a>.
            </p>
          </footer>
        );
      }

      function CorYear() {
        const slug2name = Object.fromEntries(cities.map(c => [c.slug, c.name.english]));
        const year = data.CITIES.corYear || [];
        if (!year.length) return null;
        return (
          <section id="coryear" className="m3-section">
            <p className="m3-label-small">The Cor Year</p>
            <h2 className="m3-headline-large" style={{ marginTop: 8, marginBottom: 18 }}>A love calendar that circles the year</h2>
            <p className="m3-body-large" style={{ maxWidth: 720, marginBottom: 28 }}>Beyond the daily sunset ceremony and the rotating biennale, the network keeps one shared calendar. Each city anchors a month with a love-and-life theme rooted in its own real festival, and the baton passes from city to city around the year.</p>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(220px,1fr))", gap: 16 }}>
              {year.map((m, i) => (
                <div key={i} className="m3-card-filled" style={{ padding: 22 }}>
                  <div className="m3-label-small" style={{ color: "var(--md-sys-color-primary)" }}>{m.month}</div>
                  <div style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontWeight: 700, fontSize: 22, marginTop: 6 }}>{slug2name[m.city] || m.city}</div>
                  <div className="m3-body-small" style={{ marginTop: 4, color: "var(--md-sys-color-on-surface-variant)" }}>{m.festival}</div>
                  <p className="m3-body-medium" style={{ marginTop: 10 }}>{m.theme}</p>
                </div>
              ))}
            </div>
          </section>
        );
      }

      function App() {
        useEffect(() => {
          requestAnimationFrame(() => setTimeout(() => {
            const s = document.getElementById('splash');
            if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 600); }
          }, 100));
        }, []);

        return (
          <div>
            <TopBar />
            <Hero />
            <HeartsBento />
            <HeartbeatShowcase />
            <HeroMap />
            <NetworkArc />
            <Mechanics />
            <CorYear />
            <Join />
            <Footer />
          </div>
        );
      }

      C.mount(App);
    });
  </script>

  <!-- Service worker: registered after first paint, never blocking. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>

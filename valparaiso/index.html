  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" integrity="sha512-8Q6Y9XnTbOE+JNvjBQwJ2H8S+UV4uA6hiRykhdtIyDYZ2TprdNmWOUaKdGzOhyr4dCyk287OejbPvwl7lrfqrQ==" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" integrity="sha512-MOCpqoRoisCTwJ8vQQiciZv0qcpROCidek3GTFS6KTk2+y7munJIlKCVkFCYY+p3ErYFXCjmFjnfTTRSC1OHWQ==" crossorigin="anonymous"></script>
  <script type="module" src="../_shared/cor-shared-v1.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js" integrity="sha512-OG8Ewzlpr7HnTHwrXzN256M6xbPdDJdurFYIRh0vRHOeFsL0S9yIwHiWSA2kopUevhG/ta4qyVVc2hCRSJy2MQ==" crossorigin="anonymous"></script>

  <style>
    :root {
      --rose:         #ec407a;
      --rose-dark:    #880e4f;
      --rose-light:   #f48fb1;
      --rose-pale:    #fce4ec;
      --bg:           #0d0612;
      --text-primary: #fae0ec;
      --text-muted:   #b48aa3;
      --accent:       #ad1457;
      --font-serif:   "Cormorant Garamond", Georgia, serif;
      --font-sans:    "Inter", system-ui, -apple-system, sans-serif;
    }
    body { overflow-x: hidden; background: repeating-linear-gradient(118deg, rgba(236,64,122,0.06) 0 16px, transparent 16px 44px) fixed, var(--bg); }
    .skip-link { position: absolute; top: -100px; left: 16px; background: var(--rose); color: #fff; padding: 8px 16px; border-radius: 8px; font-family: var(--font-sans); font-size: 13px; z-index: 200; text-decoration: none; transition: top .2s; }
    .skip-link:focus { top: 12px; }
    :focus-visible { outline: 2px solid var(--rose); outline-offset: 3px; border-radius: 4px; }
    .pill:focus-visible { outline: 2px solid var(--rose-light); outline-offset: 2px; }
    .vid-card { flex: 1 1 280px; max-width: 380px; padding: 0 !important; overflow: hidden; }
    @keyframes splashPulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }
    @media (max-width: 700px) {
      .vid-card { flex: 1 1 100%; max-width: 100%; }
    }
  </style>

<body>
  <a class="skip-link" href="#hero">Skip to content</a>

  <div id="splash" style="position:fixed;inset:0;background:#0d0612;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .6s ease-out">
    <svg width="80" height="74" viewBox="-15 -10 230 200" style="animation:splashPulse 1.5s ease-in-out infinite" aria-hidden="true">
      <defs><linearGradient id="sg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#e11d48"/><stop offset="100%" stop-color="#fb7185"/></linearGradient></defs>
      <path d="M100 170 C50 130 5 100 5 60 C5 28 30 8 58 8 C76 8 92 20 100 38 C108 20 124 8 142 8 C170 8 195 28 195 60 C195 100 150 130 100 170Z" fill="url(#sg)"/>
    </svg>
    <p style="font-family:sans-serif;font-size:11px;letter-spacing:4px;color:#c2185b;margin-top:20px;text-transform:uppercase">Loading</p>
  </div>

  <div id="root" role="main"></div>

  <script type="text/babel" data-presets="react">
    function waitForReady(cb) {
      if (window.CorShared && window.CorShared.ready && window.ValparaisoVocab) {
        window.CorShared.ready.then(data => cb(window.ValparaisoVocab, data));
      } else {
        setTimeout(() => waitForReady(cb), 30);
      }
    }

    waitForReady((vocab, networkData) => {
      const C = window.CorShared;
      const { Heart, BigHeart, FloatingHearts, Viral, Stat, Card, Tag, Icon,
              Heartbeat, NetworkNav, SeismicBlock, NationalStyleBlock, MilestoneRow } = C;
      const { useState, useEffect } = React;

      const navSections = [
        { id: "hero",        label: "El Cerro" },
        { id: "monument",    label: "El Faro" },
        { id: "passivhaus",  label: "Hogares" },
        { id: "architecture",label: "Arquitectura" },
        { id: "media",       label: "Media" },
        { id: "traditions",  label: "Tradiciones" },
        { id: "youth",       label: "Juventud" },
        { id: "network",     label: "Red" },
        { id: "reality",     label: "Realidad" },
        { id: "roadmap",     label: "Arco" }
      ];

      function App() {
        const [active, setActive] = useState("hero");
        const [scrollY, setScrollY] = useState(0);

        useEffect(() => {
          C.setPalette(vocab.palette);
          C.setTypography(vocab.typography);
          // Fade out splash once React has painted
          requestAnimationFrame(() => setTimeout(() => {
            const s = document.getElementById('splash');
            if (s) { s.style.opacity = '0'; setTimeout(() => s.remove(), 600); }
          }, 100));
        }, []);

        useEffect(() => {
          let ticking = false;
          const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(() => { setScrollY(window.scrollY); ticking = false; }); } };
          window.addEventListener('scroll', onScroll, { passive: true });
          return () => window.removeEventListener('scroll', onScroll);
        }, []);

        useEffect(() => {
          const obs = new IntersectionObserver(es => {
            es.forEach(e => { if (e.isIntersecting) { setActive(e.target.id); e.target.classList.add('visible'); } });
          }, { threshold: 0.1, rootMargin: "0px 0px 80px 0px" });
          navSections.forEach(s => { const el = document.getElementById(s.id); if (el) obs.observe(el); });
          return () => obs.disconnect();
        }, []);

        const scrollPct = Math.min(100, (scrollY / Math.max(1, document.body.scrollHeight - window.innerHeight)) * 100);
        const s = vocab.sections;

        return (
          <div>
            <FloatingHearts count={14} />

            <header className="m3-top-app-bar" style={{ height: "auto", flexWrap: "wrap", padding: "10px 16px", justifyContent: "center" }}>
              <a className="wordmark" href="../" style={{ marginRight: 12, fontFamily: "var(--font-serif)", fontStyle: "italic", fontWeight: 700, fontSize: 16, color: "var(--md-sys-color-primary)", textDecoration: "none" }}>Cor del Món</a>
              {navSections.map(sec => (
                <button key={sec.id} className={"pill " + (active === sec.id ? "on" : "")}
                  onClick={() => document.getElementById(sec.id)?.scrollIntoView({ behavior: "smooth" })}>
                  {sec.label}
                </button>
              ))}
              <div style={{ marginLeft: 12, display: "flex", alignItems: "center", color: "var(--md-sys-color-primary)" }}><Heartbeat size={20} /></div>
            </header>

            <div className="scrollbar" />
            <div className="scrollfill" style={{ height: scrollPct + "%" }} />

            {/* HERO */}
            <section id="hero" style={{ minHeight: "100vh", display: "flex", flexDirection: "column", justifyContent: "center", alignItems: "center", textAlign: "center", padding: "120px 30px 80px", position: "relative", zIndex: 1 }}>
              <div style={{ animation: "bob 4s ease-in-out infinite", marginBottom: 30 }}><BigHeart size={150} /></div>
              <p className="s" style={{ fontSize: 11, letterSpacing: 6, textTransform: "uppercase", color: "var(--accent)", marginBottom: 18 }}>Q3 2026 · Plan de transformación de Valparaíso</p>
              <h1 style={{ fontSize: "clamp(36px,6.5vw,78px)", fontWeight: 900, lineHeight: 1.05, marginBottom: 22, maxWidth: 900 }}>
                <span style={{ color: "var(--text-primary)" }}>{s.hero.title}</span><br/>
                <span style={{ background: "linear-gradient(135deg,var(--rose),var(--rose-light))", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>{s.hero.titleAccent}</span>
              </h1>
              <p className="body" style={{ fontSize: 17, marginBottom: 16, maxWidth: 600 }}>{s.hero.lead}</p>
              <Viral>{s.hero.viral}</Viral>
              <div style={{ display: "flex", gap: 36, flexWrap: "wrap", justifyContent: "center", marginTop: 10 }}>
                {s.hero.stats.map((st, i) => <Stat key={i} n={st.n} l={st.l} />)}
              </div>
            </section>

            {/* MONUMENT */}
            <section id="monument" className="sec">
              <p className="label">{s.monumentSection.label}</p>
              <h2 style={{ fontSize: "clamp(28px,5vw,52px)", fontWeight: 900, marginBottom: 14, lineHeight: 1.1 }}>{s.monumentSection.title}</h2>
              <p className="body" style={{ marginBottom: 16 }}>{vocab.monument.signature}</p>
              <Viral>{s.monumentSection.viral}</Viral>
              <Card glow>
                <div style={{ display: "flex", justifyContent: "center", marginBottom: 36 }}>
                  <div style={{ animation: "bob 3.5s ease-in-out infinite" }}><BigHeart size={130} /></div>
                </div>
                <div className="grid2" style={{ marginBottom: 0 }}>
                  <NationalStyleBlock style={vocab.nationalStyle} />
                  <SeismicBlock spec={vocab.seismic} />
                </div>
              </Card>
            </section>

            {/* PASSIVHAUS */}
            <section id="passivhaus" className="sec">
              <p className="label">{s.passivhaus.label}</p>
              <h2 style={{ fontSize: "clamp(28px,5vw,52px)", fontWeight: 900, marginBottom: 6, lineHeight: 1.1 }}>{s.passivhaus.title}</h2>
              <p className="s" style={{ fontSize: "clamp(14px,2vw,20px)", color: "var(--text-muted)", marginBottom: 14 }}>{s.passivhaus.subtitle}</p>
              <p className="body" style={{ marginBottom: 16 }}>{s.passivhaus.lead}</p>
              <Viral>{s.passivhaus.viral}</Viral>
              <div className="grid3" style={{ marginTop: 20 }}>
                {s.passivhaus.cards.map((c, i) => (
                  <Card key={i}>
                    <div style={{ marginBottom: 12, color: "var(--rose)" }}><Icon name={c.icon} size={28} /></div>
                    <h3 style={{ fontSize: 17, fontWeight: 700, marginBottom: 8 }}>{c.title}</h3>
                    <p className="s" style={{ fontSize: 13, color: "var(--text-hint)", lineHeight: 1.65 }}>{c.desc}</p>
                  </Card>
                ))}
              </div>
              <div style={{ marginTop: 30, display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 14, textAlign: "center" }}>
                {s.passivhaus.stats.map((st, i) => <Stat key={i} n={st.n} l={st.l} small />)}
              </div>
            </section>

            {/* ARCHITECTURE */}
            <section id="architecture" className="sec">
              <p className="label">{s.architecture.label}</p>
              <h2 style={{ fontSize: "clamp(28px,5vw,52px)", fontWeight: 900, marginBottom: 14, lineHeight: 1.1 }}>{s.architecture.title}</h2>
              <p className="body" style={{ marginBottom: 14 }}>{s.architecture.lead}</p>
              <Viral>{s.architecture.viral}</Viral>
              <div className="samples">
                {s.architecture.murals.map((m, i) => (
                  <div key={i} className={"sample" + (s.architecture.murals.length === 3 && i === 2 ? " wide" : "")}>
                    <div style={{ fontSize: 26, fontWeight: 900, marginBottom: 6, background: m.gradient, WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>{m.text}</div>
                    <div className="s" style={{ fontSize: 11, color: "var(--text-hint)" }}>{m.sub}</div>
                  </div>
                ))}
              </div>
              <Viral>Imagine telling someone your address and watching them blush</Viral>
            </section>

            {/* MEDIA */}
            <section id="media" className="sec">
              <p className="label">{s.media.label}</p>
              <h2 style={{ fontSize: "clamp(28px,5vw,52px)", fontWeight: 900, marginBottom: 14, lineHeight: 1.1 }}>{s.media.title}</h2>
              <p className="body" style={{ marginBottom: 14 }}>{s.media.lead}</p>
              <Viral>{s.media.viral}</Viral>
              <div className="grid2" style={{ marginTop: 16 }}>
                {s.media.outlets.map((o, i) => (
                  <Card key={i}>
                    <div style={{ marginBottom: 14, color: "var(--rose)" }}><Icon name={o.icon} size={32} /></div>
                    <h3 style={{ fontSize: 19, fontWeight: 700, marginBottom: 8 }}>{o.title}</h3>
                    <p className="s" style={{ fontSize: 13, color: "var(--text-muted)", lineHeight: 1.7 }}>{o.desc}</p>
                    <div style={{ marginTop: 14, display: "flex", gap: 6, flexWrap: "wrap" }}>
                      {o.tags.map((t, j) => <Tag key={j} variant={o.tagVariant || undefined}>{t}</Tag>)}
                    </div>
                  </Card>
                ))}
              </div>
              <div style={{ marginTop: 30 }}>
                <h3 style={{ fontSize: 20, fontWeight: 700, marginBottom: 12, display: "flex", alignItems: "center", gap: 10 }}><Icon name="heart" color="var(--rose)" size={14} /> {s.media.soundtrackTitle || `The Soundtrack of ${vocab.monument.name}`}</h3>
                <p className="s" style={{ fontSize: 13, color: "var(--text-hint)", lineHeight: 1.6, marginBottom: 20, maxWidth: 600 }}>{s.media.soundtrackIntro || "The sonic DNA of the city. A short curated set that captures the feeling. Click any track to open it on YouTube."}</p>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 18, justifyContent: "center" }}>
                  {s.media.soundtrack.map((t, i) => {
                    const q = encodeURIComponent(`${t.track} ${t.artist}`);
                    return (
                      <a key={i} className="card vid-card" target="_blank" rel="noopener noreferrer"
                        href={`https://www.youtube.com/results?search_query=${q}`}
                        style={{ display: "block", textDecoration: "none", color: "inherit" }}>
                        <div style={{ aspectRatio: "16 / 9", background: "linear-gradient(135deg,var(--rose-dark),var(--rose))", borderRadius: "18px 18px 0 0", display: "flex", alignItems: "center", justifyContent: "center" }}>
                          <div style={{ width: 56, height: 56, borderRadius: "50%", background: "rgba(0,0,0,0.45)", display: "flex", alignItems: "center", justifyContent: "center", border: "2px solid rgba(255,255,255,0.85)" }}>
                            <div style={{ width: 0, height: 0, borderLeft: "16px solid white", borderTop: "10px solid transparent", borderBottom: "10px solid transparent", marginLeft: 4 }} />
                          </div>
                        </div>
                        <div style={{ padding: "16px 20px" }}>
                          <div style={{ fontSize: 15, fontWeight: 700 }}>{t.track}</div>
                          <div style={{ fontSize: 12, color: "var(--text-hint)", marginTop: 2 }}>{t.artist}{t.released ? ` · ${t.released}` : ''}</div>
                          <p className="s" style={{ fontSize: 12, color: "var(--text-hint)", marginTop: 10, lineHeight: 1.55 }}>{t.note}</p>
                          <div style={{ fontSize: 10, marginTop: 10, color: "var(--rose)", textTransform: "uppercase", letterSpacing: 1.5, fontWeight: 600 }}>Listen on YouTube ↗</div>
                        </div>
                      </a>
                    );
                  })}
                </div>
              </div>
            </section>

            {/* TRADITIONS */}
            <section id="traditions" className="sec">
              <p className="label">{s.traditions.label}</p>
              <h2 style={{ fontSize: "clamp(28px,5vw,52px)", fontWeight: 900, marginBottom: 14, lineHeight: 1.1 }}>{s.traditions.title}</h2>
              <p className="body" style={{ marginBottom: 14 }}>{s.traditions.lead}</p>
              <Viral>{s.traditions.viral}</Viral>
              <div style={{ display: "grid", gap: 18, marginTop: 16 }}>
                {s.traditions.categories.map((cat, i) => (
                  <Card key={i}>
                    <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 18 }}>
                      <span style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: 32, fontWeight: 900, color: "var(--rose)", width: 40, textAlign: "center" }}>{cat.monogram}</span>
                      <h3 style={{ fontSize: 20, fontWeight: 700 }}>{cat.title}</h3>
                    </div>
                    <div className="grid2">
                      {cat.items.map((item, j) => (
                        <div key={j} style={{ padding: "6px 0" }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 3 }}>
                            <Icon name="heart" size={9} color="var(--rose)" />
                            <span style={{ fontSize: 13, fontWeight: 700 }}>{item[0]}</span>
                          </div>
                          <p className="s" style={{ fontSize: 12, color: "var(--text-hint)", lineHeight: 1.6, paddingLeft: 17 }}>{item[1]}</p>
                        </div>
                      ))}
                    </div>
                  </Card>
                ))}
              </div>
            </section>

            {/* YOUTH */}
            <section id="youth" className="sec">
              <p className="label">{s.youth.label}</p>
              <h2 style={{ fontSize: "clamp(28px,5vw,52px)", fontWeight: 900, marginBottom: 14, lineHeight: 1.1 }}>{s.youth.title}</h2>
              <p className="body" style={{ marginBottom: 14 }}>{s.youth.lead}</p>
              <Viral>{s.youth.viral}</Viral>
              <div className="grid3" style={{ marginTop: 16 }}>
                {s.youth.cards.map((c, i) => (
                  <Card key={i}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 12 }}>
                      <span style={{ color: "var(--rose)" }}><Icon name={c.icon} size={26} /></span>
                      <Tag variant="gold">{c.tag}</Tag>
                    </div>
                    <h3 style={{ fontSize: 17, fontWeight: 700, marginBottom: 6 }}>{c.title}</h3>
                    <p className="s" style={{ fontSize: 13, color: "var(--text-hint)", lineHeight: 1.65 }}>{c.desc}</p>
                  </Card>
                ))}
              </div>
              <div style={{ marginTop: 30, display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(140px,1fr))", gap: 14, textAlign: "center" }}>
                {s.youth.stats.map((st, i) => <Stat key={i} n={st.n} l={st.l} small />)}
              </div>
            </section>

            {/* NETWORK */}
            <section id="network" className="sec">
              <p className="label">{s.network.label}</p>
              <h2 style={{ fontSize: "clamp(28px,5vw,52px)", fontWeight: 900, marginBottom: 14, lineHeight: 1.1 }}>{s.network.title}</h2>
              <p className="body" style={{ marginBottom: 16 }}>{s.network.lead}</p>
              <Viral>{s.network.viral}</Viral>
              <div style={{ marginTop: 28 }}>
                <NetworkNav currentCity={vocab.city.slug} />
              </div>
            </section>

            {/* REALITY: feasibility, costs, impact, alternatives */}
            {(vocab.feasibility || vocab.costs || vocab.impact || vocab.alternatives) && (
              <section id="reality" className="sec">
                <p className="label">Reality check</p>
                <h2 style={{ fontSize: "clamp(28px,5vw,52px)", fontWeight: 900, marginBottom: 14, lineHeight: 1.1 }}>The constraints we are honest about</h2>
                <p className="body" style={{ marginBottom: 24, maxWidth: 720 }}>Real projects need real acknowledgement. Below are the binding constraints, approximate costs, expected impact, and fall-back options for this city. The aim is to surface the obstacles before any reviewer would have to put them in a rejection letter.</p>

                {vocab.feasibility && (
                  <div style={{ marginTop: 24 }}>
                    <h3 style={{ fontSize: 22, fontWeight: 700, marginBottom: 8 }}>{vocab.feasibility.title}</h3>
                    <p className="s" style={{ fontSize: 13, color: "var(--text-hint)", marginBottom: 14, maxWidth: 720 }}>{vocab.feasibility.intro}</p>

                    {vocab.feasibility.category && (
                      <Card>
                        <div style={{ fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase", color: "var(--text-hint)", marginBottom: 6, fontWeight: 700 }}>Category</div>
                        <p style={{ fontSize: 14, color: "var(--text-primary)", lineHeight: 1.55, margin: 0 }}>{vocab.feasibility.category}</p>
                      </Card>
                    )}

                    {vocab.feasibility.permissionChain && (
                      <div style={{ marginTop: 14 }}>
                        <Card>
                          <div style={{ fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase", color: "var(--text-hint)", marginBottom: 10, fontWeight: 700 }}>Permission chain</div>
                          <ol style={{ paddingLeft: 18, margin: 0 }}>
                            {vocab.feasibility.permissionChain.map((step, i) => (
                              <li key={i} style={{ fontSize: 13, color: "var(--text-primary)", lineHeight: 1.55, marginBottom: 8 }}>{step}</li>
                            ))}
                          </ol>
                        </Card>
                      </div>
                    )}

                    {vocab.feasibility.budgetSources && (
                      <div style={{ marginTop: 14 }}>
                        <Card>
                          <div style={{ fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase", color: "var(--text-hint)", marginBottom: 10, fontWeight: 700 }}>Budget sources</div>
                          <ul style={{ paddingLeft: 18, margin: 0 }}>
                            {vocab.feasibility.budgetSources.map((src, i) => (
                              <li key={i} style={{ fontSize: 13, color: "var(--text-primary)", lineHeight: 1.55, marginBottom: 8 }}>{src}</li>
                            ))}
                          </ul>
                        </Card>
                      </div>
                    )}

                    {vocab.feasibility.items && (
                      <div style={{ marginTop: 14 }}>
                        <Card>
                          <ul style={{ listStyle: "none", padding: 0, margin: 0 }}>
                            {vocab.feasibility.items.map((it, i) => (
                              <li key={i} style={{ marginBottom: 14, paddingBottom: 14, borderBottom: i < vocab.feasibility.items.length - 1 ? "1px solid var(--border-soft)" : "none" }}>
                                <div style={{ fontSize: 11, letterSpacing: 1.5, textTransform: "uppercase", color: "var(--rose)", marginBottom: 4, fontWeight: 700 }}>{it.area}</div>
                                <p className="s" style={{ fontSize: 13, color: "var(--text-primary)", lineHeight: 1.6 }}>{it.detail}</p>
                              </li>
                            ))}
                          </ul>
                        </Card>
                      </div>
                    )}
                  </div>
                )}

                {vocab.costs && (
                  <div style={{ marginTop: 30 }}>
                    <h3 style={{ fontSize: 22, fontWeight: 700, marginBottom: 8 }}>{vocab.costs.title}</h3>
                    <p className="s" style={{ fontSize: 13, color: "var(--text-hint)", marginBottom: 14, maxWidth: 720 }}>{vocab.costs.intro}</p>
                    <div style={{ background: "linear-gradient(135deg,var(--rose-pale),transparent)", border: "1px solid var(--border-soft)", borderRadius: 18, padding: "20px 24px", marginBottom: 16 }}>
                      <div style={{ fontSize: 11, letterSpacing: 2, textTransform: "uppercase", color: "var(--text-hint)" }}>Monument total</div>
                      <div style={{ fontSize: 28, fontWeight: 900, color: "var(--rose)", marginTop: 4 }}>{vocab.costs.monumentTotal}</div>
                    </div>
                    <Card>
                      {vocab.costs.stages.map((st, i) => (
                        <div key={i} style={{ marginBottom: 14, paddingBottom: 14, borderBottom: i < vocab.costs.stages.length - 1 ? "1px solid var(--border-soft)" : "none" }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", flexWrap: "wrap", gap: 10 }}>
                            <div style={{ fontSize: 14, fontWeight: 700 }}>{st.phase}</div>
                            <div style={{ fontSize: 13, color: "var(--rose)", fontWeight: 700 }}>{st.range}</div>
                          </div>
                          <p className="s" style={{ fontSize: 12, color: "var(--text-hint)", marginTop: 4, lineHeight: 1.55 }}>{st.scope}</p>
                        </div>
                      ))}
                    </Card>
                    <p className="s" style={{ fontSize: 12, color: "var(--text-muted)", marginTop: 12, fontStyle: "italic", maxWidth: 720 }}>{vocab.costs.fundingNote}</p>
                  </div>
                )}

                {vocab.impact && (
                  <div style={{ marginTop: 30 }}>
                    <h3 style={{ fontSize: 22, fontWeight: 700, marginBottom: 14 }}>{vocab.impact.title}</h3>
                    <Card>
                      <ul style={{ listStyle: "none", padding: 0, margin: 0 }}>
                        {vocab.impact.items.map((it, i) => (
                          <li key={i} style={{ marginBottom: 14, paddingBottom: 14, borderBottom: i < vocab.impact.items.length - 1 ? "1px solid var(--border-soft)" : "none" }}>
                            <div style={{ fontSize: 14, fontWeight: 700, color: "var(--rose)" }}>{it.metric}</div>
                            <p className="s" style={{ fontSize: 12, color: "var(--text-hint)", marginTop: 4, lineHeight: 1.55 }}>{it.note}</p>
                          </li>
                        ))}
                      </ul>
                    </Card>
                  </div>
                )}

                {vocab.alternatives && (
                  <div style={{ marginTop: 30 }}>
                    <h3 style={{ fontSize: 22, fontWeight: 700, marginBottom: 8 }}>{vocab.alternatives.title}</h3>
                    <p className="s" style={{ fontSize: 13, color: "var(--text-hint)", marginBottom: 14, maxWidth: 720 }}>{vocab.alternatives.intro}</p>
                    <div style={{ display: "grid", gap: 12 }}>
                      {vocab.alternatives.items.map((it, i) => (
                        <Card key={i}>
                          <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 6 }}>{it.fallback}</div>
                          <p className="s" style={{ fontSize: 12, color: "var(--text-hint)", lineHeight: 1.55 }}>{it.reason}</p>
                        </Card>
                      ))}
                    </div>
                  </div>
                )}
              </section>
            )}

            {/* ROADMAP */}
            <section id="roadmap" className="sec">
              <p className="label">{s.roadmap.label}</p>
              <h2 style={{ fontSize: "clamp(28px,5vw,52px)", fontWeight: 900, marginBottom: 14, lineHeight: 1.1 }}>{s.roadmap.title}</h2>
              <p className="body" style={{ marginBottom: 18 }}>{s.roadmap.lead}</p>
              <Viral>{s.roadmap.viral}</Viral>
              <Card>
                {s.roadmap.milestones.map((m, i) => (
                  <MilestoneRow key={i} year={m.year} stage={m.stage}
                    commitment={m.commitment} networkContribution={m.networkContribution} />
                ))}
              </Card>
            </section>

            <footer style={{ textAlign: "center", padding: "50px 30px 30px", borderTop: "1px solid var(--border-soft)", position: "relative", zIndex: 1 }}>
              <Heartbeat size={26} />
              <p className="s" style={{ fontSize: 9, color: "#5a3040", marginTop: 12, letterSpacing: 3 }}>REGIÓN DE VALPARAÍSO · COR DEL MÓN · Q3 2026</p>
              <p style={{ fontFamily: "var(--font-serif)", fontStyle: "italic", fontSize: 22, color: "var(--rose)", marginTop: 18 }}><a href="../" style={{ color: "inherit", textDecoration: "none" }}>Cor del Món</a></p>
              <p className="s" style={{ fontSize: 10, color: "#5a3040", marginTop: 14, letterSpacing: 1 }}>© 2026 sara-star-quant. Code under PolyForm Noncommercial 1.0.0, content under CC BY-NC 4.0. No commercial licensing, no paid consultancy, no investment solicitation. No funds have been raised, applied for, awarded, committed, or accepted.</p>
              <p className="s" style={{ fontSize: 9, color: "#2d1842", marginTop: 10, lineHeight: 1.65, maxWidth: 640, margin: "10px auto 0" }}>
                <strong>Disclaimer.</strong> Cor del Món is a conceptual design proposal and creative-research project. Nothing on this site is professional advice (legal, financial, architectural, urban-planning, immigration, heritage, medical, or any other kind). All numbers (heights, costs, housing counts, milestones, residency intakes, percentages, foundation budgets) are illustrative and will differ materially upon any formal review. Named authorities, ministries, corporations, foundations, architects, and individuals are referenced descriptively for context only; no partnership, endorsement, or affiliation is claimed or implied. All Spanish content is a Q3 2026 design proposal awaiting Chilean-Spanish native-speaker review before any real-world implementation. No solicitation of investment is made. The proposal adjusts to the world; where it conflicts with existing law, regulation, or community will, the existing law, regulation, or community will prevails. <a href="../DISCLAIMER.md" style={{ color: "var(--text-hint)", textDecoration: "underline" }}>Read the full disclaimer at /DISCLAIMER.md</a>.
              </p>
            </footer>
          </div>
        );
      }

      C.mount(App);
    });
  </script>

  <!-- Service worker: registered after first paint, never blocking. -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
